  brace-expansion@>=4: ^5.0.9 # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  browserslist: ^4.28.7 # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g
  js-yaml: ^4.3.1 # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
